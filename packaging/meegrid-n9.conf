# MeeGrid service: restores the launcher icon layout on request (stops and
# starts xsession/mthome) and makes the daily automatic backup.
# Started by load-launcher after login.
description "MeeGrid launcher layout backup service"
author "smyhu <smyhu@users.noreply.github.com>"

stop on stopping xsession

console none
respawn
respawn limit 3 30
nice 5
normal exit 0

exec /usr/bin/python /opt/meegrid-n9/meegridd.py
